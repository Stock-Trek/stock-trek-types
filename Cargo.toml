[package]
name = "stock-trek-types"
version = "0.4.5"
edition = "2024"
description = "Types for use with stock-trek"
authors = ["stock-trek.com <stock-trek@proton.me>"]
license = "MIT"
repository = "https://github.com/Stock-Trek/stock-trek-types"
readme = "README.md"
keywords = [
  "algorithm",
  "bot",
  "crypto",
  "quant",
  "trading",
]

[dependencies]
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"], optional = true }
strum = { version = "0.28", features = ["derive"] }
strum_macros = { version = "0.28", optional = true }

[features]
default = []
serde = [
  "dep:serde",
  "dep:strum_macros",
  "rust_decimal/serde",
]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
features = []
no-deps = true
targets = ["x86_64-unknown-linux-gnu"]
